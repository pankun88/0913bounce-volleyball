<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>바운스발리볼</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .landing { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; gap:22px; text-align:center; }
  .landing .emoji { font-size:54px; }
  .landing h1 { color: var(--red-dark); margin: 0; }
  .landing .links { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .landing .links a { padding: 14px 28px; border-radius: 14px; font-weight: 800; box-shadow: var(--shadow); }
  .landing .links a.admin { background: var(--red); color: white; }
  .landing .links a.dash { background: white; color: var(--red-dark); }
</style>
</head>
<body>
  <div class="landing">
    <div class="emoji">🏐</div>
    <h1>바운스발리볼</h1>
    <p style="color:var(--muted);">관리자 페이지에서 경기를 기록하면, 대시보드에 실시간으로 반영됩니다.</p>
    <div class="links">
      <a class="admin" href="admin.html">⚙️ 관리자 페이지</a>
      <a class="dash" href="dashboard.html">📺 실시간 대시보드</a>
    </div>
  </div>
</body>
</html>
