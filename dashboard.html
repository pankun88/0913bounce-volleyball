<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>바운스발리볼 실시간 대시보드</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/bracket.css" />
</head>
<body>
<div class="app-shell" id="dashboardShell">

  <div class="top-bar">
    <div class="brand"><span class="emoji">🏐</span> <span id="dashTitle">바운스발리볼</span> <span id="dashDivisionBadge" class="division-badge">남자부</span></div>
    <span class="live-dot">실시간 중계중</span>
  </div>

  <div id="errorBanner" class="error-banner"></div>

  <div class="division-switch" id="dashDivisionSwitch" role="group" aria-label="경기 부문 선택">
    <button type="button" class="division-btn active" data-division="men">남자부</button>
    <button type="button" class="division-btn" data-division="women">여자부</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="prelim">예선</button>
    <button class="tab-btn" data-tab="final">본선</button>
  </div>

  <!-- 예선 -->
  <section class="tab-panel active" id="tab-prelim">
    <div id="dashPrelim" class="grid-auto"></div>
  </section>

  <!-- 본선 -->
  <section class="tab-panel" id="tab-final">
    <div class="card" id="dashBracketCard">
      <div class="bracket-header">
        <div class="bracket-banner"><span>🏆</span> <span id="dashBracketTitle">본선 대진표</span></div>
        <button type="button" class="bracket-fullscreen-btn" id="dashBracketFullscreenBtn">⛶ 전체화면</button>
      </div>
      <div class="bracket-wrap" id="dashBracketContainer"></div>
    </div>
  </section>

  <p class="footer-note">바운스발리볼 · 실시간 경기 결과 대시보드</p>

  <div id="venueStatusHome"></div>
  <section id="venueSwitcher" class="venue-switcher" hidden aria-label="경기 부문 자동 전환 상태">
    <div class="venue-switcher-line">
      <strong id="venueCurrentDivision">남자부</strong>
      <span id="venueNextDivision"></span>
      <time id="venueCountdown"></time>
    </div>
    <div id="venueProgressTrack" class="venue-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div id="venueProgressBar" class="venue-progress-bar"></div>
    </div>
  </section>
</div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
