<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firebase 연결 테스트 · 바운스발리볼</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .test-wrap { max-width: 640px; margin: 40px auto; padding: 0 20px; }
  .test-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
  .step { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: none; }
  .step-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
  .step-body { flex: 1; }
  .step-title { font-weight: 700; }
  .step-detail { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; word-break: break-all; }
  .step.pending .step-icon::before { content: "⏳"; }
  .step.ok .step-icon::before { content: "✅"; }
  .step.fail .step-icon::before { content: "❌"; }
  .test-btn { margin-top: 16px; }
  .summary { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-weight: 700; }
  .summary.ok { background: #e6f4ea; color: var(--win); }
  .summary.fail { background: #fdeae3; color: var(--red-dark); }
</style>
</head>
<body>
  <div class="test-wrap">
    <div class="test-card">
      <h2 style="margin-top:0;">🔌 Firebase 연결 테스트</h2>
      <p style="color: var(--muted); font-size: 14px;">
        <code>js/firebase-config.js</code>에 입력한 설정값으로 실제 Firestore에
        쓰기·읽기·삭제가 정상 동작하는지 확인합니다. (배포 전 로컬에서 열어도 되고, 배포 후 접속해도 됩니다)
      </p>
      <button id="runBtn" class="btn btn-primary test-btn">테스트 시작</button>
      <div id="steps" style="margin-top: 18px;"></div>
      <div id="summary"></div>
    </div>
  </div>

  <script type="module">
    import { doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { db, isFirebaseConfigured } from "./js/firebase-init.js";

    const stepsEl = document.getElementById("steps");
    const summaryEl = document.getElementById("summary");
    const runBtn = document.getElementById("runBtn");

    const STEP_DEFS = [
      { key: "config", title: "1. firebase-config.js 값 확인" },
      { key: "write", title: "2. Firestore 쓰기 테스트 (_diagnostic 문서 생성)" },
      { key: "read", title: "3. Firestore 읽기 테스트 (방금 쓴 문서 다시 읽기)" },
      { key: "cleanup", title: "4. 테스트 문서 정리 (삭제)" },
    ];

    function renderSteps(state) {
      stepsEl.innerHTML = STEP_DEFS.map((s) => {
        const st = state[s.key] || { status: "pending", detail: "" };
        return `<div class="step ${st.status}">
          <div class="step-icon"></div>
          <div class="step-body">
            <div class="step-title">${s.title}</div>
            ${st.detail ? `<div class="step-detail">${escapeHtml(st.detail)}</div>` : ""}
          </div>
        </div>`;
      }).join("");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = String(str);
      return div.innerHTML;
    }

    const state = {};
    STEP_DEFS.forEach((s) => (state[s.key] = { status: "pending", detail: "" }));
    renderSteps(state);

    runBtn.addEventListener("click", async () => {
      runBtn.disabled = true;
      summaryEl.innerHTML = "";
      STEP_DEFS.forEach((s) => (state[s.key] = { status: "pending", detail: "" }));
      renderSteps(state);

      // 1. config 확인
      if (!isFirebaseConfigured) {
        state.config = { status: "fail", detail: "firebase-config.js 값이 아직 YOUR_... placeholder 입니다." };
        renderSteps(state);
        summaryEl.innerHTML = `<div class="summary fail">설정값을 먼저 입력해 주세요.</div>`;
        runBtn.disabled = false;
        return;
      }
      state.config = { status: "ok", detail: "config 값이 입력되어 있습니다." };
      renderSteps(state);

      const testDocRef = doc(db, "tournaments", "main", "_diagnostic", "ping");
      const payload = { checkedAt: new Date().toISOString(), from: "connection-test.html" };

      // 2. 쓰기
      try {
        await setDoc(testDocRef, payload);
        state.write = { status: "ok", detail: "tournaments/main/_diagnostic/ping 문서를 생성했습니다." };
      } catch (err) {
        state.write = { status: "fail", detail: `${err.code || ""} ${err.message}` };
        renderSteps(state);
        summaryEl.innerHTML = `<div class="summary fail">❌ 실패 — Firestore가 생성되지 않았거나, 보안 규칙이 배포되지 않았거나, 설정값(특히 projectId)이 잘못되었을 수 있습니다.</div>`;
        runBtn.disabled = false;
        return;
      }
      renderSteps(state);

      // 3. 읽기
      try {
        const snap = await getDoc(testDocRef);
        if (snap.exists()) {
          state.read = { status: "ok", detail: `읽어온 값: ${JSON.stringify(snap.data())}` };
        } else {
          state.read = { status: "fail", detail: "문서를 썼지만 다시 읽어오지 못했습니다." };
        }
      } catch (err) {
        state.read = { status: "fail", detail: `${err.code || ""} ${err.message}` };
      }
      renderSteps(state);

      // 4. 정리
      try {
        await deleteDoc(testDocRef);
        state.cleanup = { status: "ok", detail: "테스트 문서를 삭제했습니다." };
      } catch (err) {
        state.cleanup = { status: "fail", detail: `${err.code || ""} ${err.message}` };
      }
      renderSteps(state);

      const allOk = STEP_DEFS.every((s) => state[s.key].status === "ok");
      summaryEl.innerHTML = allOk
        ? `<div class="summary ok">✅ 모두 통과 — Firebase 연동이 정상 동작합니다. 관리자 페이지에서 안심하고 사용하세요.</div>`
        : `<div class="summary fail">❌ 일부 단계 실패 — 위 상세 메시지를 확인해 주세요. (흔한 원인: Firestore Database 미생성, 보안 규칙 미배포, projectId 오타)</div>`;
      runBtn.disabled = false;
    });
  </script>
</body>
</html>
