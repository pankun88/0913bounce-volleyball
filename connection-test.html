<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firebase 연결 테스트 · 바운스발리볼</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .test-wrap { max-width: 640px; margin: 40px auto; padding: 0 20px; }
  .test-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
  .step { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: none; }
  .step-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
  .step-body { flex: 1; }
  .step-title { font-weight: 700; }
  .step-detail { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; word-break: break-all; }
  .step.pending .step-icon::before { content: "⏳"; }
  .step.ok .step-icon::before { content: "✅"; }
  .step.fail .step-icon::before { content: "❌"; }
  .test-btn { margin-top: 16px; }
  .summary { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-weight: 700; }
  .summary.ok { background: #e6f4ea; color: var(--win); }
  .summary.fail { background: #fdeae3; color: var(--red-dark); }
</style>
</head>
<body>
  <div class="test-wrap">
    <div class="test-card">
      <h2 style="margin-top:0;">🔌 Firebase 연결 테스트</h2>
      <p style="color: var(--muted); font-size: 14px;">
        현재 고정 설정으로 공개 Firestore 읽기와 공개 Cloud Functions 응답이 가능한지 확인합니다.
        관리자 로그인·권한 쓰기 동작은 관리자 화면과 에뮬레이터 릴리스 테스트에서 별도로 검증합니다.
      </p>
      <button id="runBtn" class="btn btn-primary test-btn">테스트 시작</button>
      <div id="steps" style="margin-top: 18px;"></div>
      <div id="summary"></div>
    </div>
  </div>

  <script type="module">
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
    import { db, functions, isFirebaseConfigured } from "./js/firebase-init.js";

    const stepsEl = document.getElementById("steps");
    const summaryEl = document.getElementById("summary");
    const runBtn = document.getElementById("runBtn");

    const STEP_DEFS = [
      { key: "config", title: "1. firebase-config.js 값 확인" },
      { key: "firestore", title: "2. 공개 대회정보 읽기 테스트" },
      { key: "functions", title: "3. Cloud Functions 연결 테스트" },
    ];

    function renderSteps(state) {
      stepsEl.innerHTML = STEP_DEFS.map((s) => {
        const st = state[s.key] || { status: "pending", detail: "" };
        return `<div class="step ${st.status}">
          <div class="step-icon"></div>
          <div class="step-body">
            <div class="step-title">${s.title}</div>
            ${st.detail ? `<div class="step-detail">${escapeHtml(st.detail)}</div>` : ""}
          </div>
        </div>`;
      }).join("");
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = String(str);
      return div.innerHTML;
    }

    const state = {};
    STEP_DEFS.forEach((s) => (state[s.key] = { status: "pending", detail: "" }));
    renderSteps(state);

    runBtn.addEventListener("click", async () => {
      runBtn.disabled = true;
      summaryEl.innerHTML = "";
      STEP_DEFS.forEach((s) => (state[s.key] = { status: "pending", detail: "" }));
      renderSteps(state);

      // 1. config 확인
      if (!isFirebaseConfigured) {
        state.config = { status: "fail", detail: "firebase-config.js 값이 아직 YOUR_... placeholder 입니다." };
        renderSteps(state);
        summaryEl.innerHTML = `<div class="summary fail">설정값을 먼저 입력해 주세요.</div>`;
        runBtn.disabled = false;
        return;
      }
      state.config = { status: "ok", detail: "config 값이 입력되어 있습니다." };
      renderSteps(state);

      // 2. 현재 보안 규칙이 허용하는 공개 대회정보 읽기
      try {
        const snap = await getDoc(doc(db, "tournaments", "main"));
        if (!snap.exists()) throw new Error("tournaments/main 대회 문서가 없습니다.");
        state.firestore = { status: "ok", detail: `대회정보를 읽었습니다: ${snap.data().name || "이름 미설정"}` };
      } catch (err) {
        state.firestore = { status: "fail", detail: `${err.code || ""} ${err.message}` };
        renderSteps(state);
        summaryEl.innerHTML = `<div class="summary fail">실패 — Firestore 대회 문서, 공개 읽기 규칙, projectId를 확인하세요.</div>`;
        runBtn.disabled = false;
        return;
      }
      renderSteps(state);

      // 3. 인증 없이 호출 가능한 서버 시계로 Functions 배포 상태 확인
      try {
        const response = await httpsCallable(functions, "getServerClock")({ tournamentId: "main" });
        const serverTimeMs = Number(response.data?.serverTimeMs);
        if (!Number.isFinite(serverTimeMs)) throw new Error("서버 시각 응답이 올바르지 않습니다.");
        state.functions = { status: "ok", detail: `서버 응답 정상: ${new Date(serverTimeMs).toLocaleString()}` };
      } catch (err) {
        state.functions = { status: "fail", detail: `${err.code || ""} ${err.message}` };
      }
      renderSteps(state);

      const allOk = STEP_DEFS.every((s) => state[s.key].status === "ok");
      summaryEl.innerHTML = allOk
        ? `<div class="summary ok">모두 통과 — Firestore와 Cloud Functions 연결이 정상입니다.</div>`
        : `<div class="summary fail">일부 단계 실패 — Functions·Rules·Hosting을 같은 프로젝트에 함께 배포했는지 확인하세요.</div>`;
      runBtn.disabled = false;
    });
  </script>
</body>
</html>
